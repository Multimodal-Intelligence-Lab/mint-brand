<!doctype html>
<html lang="en">
<head>
  <base href="file:///mmfs1/scratch/jacks.local/hdubey/MINT-Lab/mint-brand/readme-header/">
<meta charset="utf-8">
<title>MINT README header</title>
<style>
  @import "../brand/colors.css";
  @font-face {
    font-family: "Inter";
    src: url("../brand/fonts/inter-variable-latin.woff2") format("woff2");
    font-weight: 100 900; font-display: block;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* The lab's GitHub README banner — same brand identity as the deck and the poster band
     (SDSU|MINT lockup left · big --sdsu-blue title centered · QR right · blue corner triangle),
     ported to a 1280×160 (8:1) banner so the title reads at GitHub's rendered width. Flat
     --sdsu-yellow ground, opaque + full-bleed, so the ONE PNG reads on light AND dark GitHub themes.
     Text uses the brand token --sdsu-blue (never raw hex). Don't edit the chrome below — edit only
     the marked content in <body>. Keep the title SHORT (the big type is the point); for a long title
     drop the .title font-size a few px — .center is clipped by the band. Re-render with: node build.mjs */
  .banner {
    width: 1280px; height: 160px;            /* banner — keep fixed; tune the title, not this */
    font-family: "Inter", -apple-system, sans-serif;
    position: relative; overflow: hidden;
    background: var(--sdsu-yellow); color: var(--sdsu-blue);
  }
  .corner { position: absolute; top: 0; right: 0; width: 54px; height: 54px; z-index: 3; }   /* 0.34 × band-h, as the poster */
  .lockup {
    position: absolute; left: 34px; top: 50%; transform: translateY(-50%);
    z-index: 2; display: flex; align-items: center; gap: 18px;
  }
  .lockup .sdsu { height: 116px; width: auto; display: block; }   /* ~72% of band, as the deck/poster */
  .lockup .mint { height: 106px; width: auto; display: block; }
  .lockup .sep  { width: 2px; align-self: stretch; background: var(--sdsu-blue); opacity: 0.85; }
  .center {
    position: absolute; left: 20%; right: 16%; top: 50%; transform: translateY(-50%);
    text-align: center; z-index: 2;
  }
  .center .title   { font-size: 54px; font-weight: 900; line-height: 1.02; letter-spacing: 0.4px; margin: 0; }
  .center .affil   { font-size: 18px; font-weight: 700; margin: 8px 0 0; opacity: 0.95; }
  .center .extras  { font-size: 14.5px; font-weight: 600; margin: 4px 0 0; opacity: 0.82; letter-spacing: 0.2px; white-space: nowrap; }
  .qr { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); height: 108px; width: auto; z-index: 2; }
</style>
</head>
<body>
<div class="banner">
  <!-- brand chrome — do not edit -->
  <svg class="corner" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path style="fill:var(--sdsu-blue)" d="M0 0 L100 0 L100 88 Q100 100 92 92 Z"/>
  </svg>
  <div class="lockup">
    <img class="sdsu" src="../brand/logos/sdsu-logo.png" alt="South Dakota State University">
    <span class="sep"></span>
    <img class="mint" src="../brand/logos/mint-logo.png" alt="Multimodal Intelligence Lab">
  </div>

  <!-- ↓↓↓ EDIT FOR YOUR PROJECT ↓↓↓ -->
  <div class="center">
    <p class="title"><b>MuSDeT</b></p>
    <p class="affil">South Dakota State University &middot; Multimodal Intelligence Lab</p>
    <p class="extras">Multi-Scale Encoding &middot; Gated Fusion &middot; Temporal Context</p>
  </div>
  <!-- QR → the lab GitHub org by default; swap for your project QR or delete the line to drop it -->
  <img class="qr" src="../brand/qr/mint-lab-qr.png" alt="Lab QR — github.com/Multimodal-Intelligence-Lab">
  <!-- ↑↑↑ EDIT FOR YOUR PROJECT ↑↑↑ -->
</div>
</body>
</html>
